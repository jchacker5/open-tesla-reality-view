[project]
name = "open-tesla-reality-view"
version = "0.1.0"
description = "Tesla dashcam (4 or 6 cameras) -> 3D Gaussian splat replay"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pillow>=10", "scipy>=1.11"]

[project.optional-dependencies]
movers = ["ultralytics>=8.3"]
# Bench v2 LPIPS, Depth Anything V2 dense init, the sky segmentation model: ~1 GB (PyTorch).
quality = ["torch>=2.3", "torchvision>=0.18", "lpips>=0.1.4", "transformers>=4.45"]

[project.scripts]
otrv = "tsplat.__main__:main"
tsplat = "tsplat.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["tsplat"]

# Ship the viewer inside the package so `otrv view` works from a wheel install. The source stays
# at viewer/index.html; a source checkout (incl. editable installs) reads it from there.
[tool.hatch.build.targets.wheel.force-include]
"viewer/index.html" = "tsplat/viewer/index.html"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
