<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive Replay</title>
<style>
  :root {
    --bg: #07080a; --panel: #101216; --line: #1f232a; --text: #e8eaee; --dim: #8a909c;
    --accent: #3d7bff; --ok: #3ecf8e; --warn: #f5a524; --sig: #2fd36b;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; overflow: hidden; }
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100%; gap: 10px; padding: 10px; }
  .label { font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 2px 2px 6px; }
  .side { min-height: 0; display: flex; flex-direction: column; }
  .cams { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: min-content; gap: 6px; overflow: auto; }
  .cam { position: relative; background: #000; border-radius: 6px; overflow: hidden; aspect-ratio: 4/3; }
  .cam.wide { grid-column: span 2; aspect-ratio: 16/10; }
  .cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cam span { position: absolute; left: 6px; bottom: 6px; font: 10px var(--mono); letter-spacing: .06em;
    background: rgba(0,0,0,.65); padding: 2px 5px; border-radius: 3px; text-transform: uppercase; }
  .stage { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .view { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; border-radius: 10px; overflow: hidden; background: #000; }
  .frame { position: relative; width: 100%; height: 100%; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; }
  canvas.grab { touch-action: none; }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 95% at 50% 46%, transparent 58%, rgba(0,0,0,.42) 100%); }

  /* HUD */
  .hud { position: absolute; top: 16px; left: 18px; pointer-events: none; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .hudTop { display: flex; align-items: center; gap: 12px; }
  .speedBlock { display: flex; align-items: center; gap: 12px; }
  .speed { font-size: 64px; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; min-width: 1.2ch; }
  .unit { font: 11px var(--mono); color: var(--dim); letter-spacing: .1em; margin-top: 2px; background: none; border: 0; padding: 0;
    height: auto; min-width: 0; pointer-events: auto; cursor: pointer; }
  .gears { display: flex; flex-direction: column; font: 600 11px/1.28 var(--mono); color: rgba(232,234,238,.26); }
  .gears .on { color: var(--text); }
  .hudRow { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .sig { width: 22px; height: 22px; color: var(--sig); opacity: .14; filter: drop-shadow(0 0 0 transparent); }
  .sig.on { opacity: 1; filter: drop-shadow(0 0 6px rgba(47,211,107,.7)); }
  .wheel { width: 30px; height: 30px; color: #cfd3da; }
  .wheel.ap { color: var(--accent); filter: drop-shadow(0 0 6px rgba(61,123,255,.6)); }
  .chips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .chip { font: 11px var(--mono); padding: 3px 7px; border-radius: 4px; background: rgba(16,18,22,.75); border: 1px solid var(--line); }
  .chip.on { color: var(--accent); border-color: var(--accent); }
  .chip.warn { color: var(--warn); border-color: var(--warn); }
  .meta { position: absolute; top: 16px; right: 18px; text-align: right; font: 11px var(--mono); color: var(--dim); pointer-events: none;
    text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .meta .date { color: var(--text); font-size: 12px; }
  .toast { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); background: rgba(16,18,22,.92); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; font: 12px var(--mono); z-index: 5; pointer-events: none; }
  /* flags */
  .app.clean, .app.noui { grid-template-columns: 1fr; }
  .app.clean .side, .app.clean .meta { display: none; }
  .app.noui .side, .app.noui .hud, .app.noui .meta, .app.noui .bar, .app.noui .toast { display: none; }
  .app.noui { padding: 0; }
  .app.noui .view { border-radius: 0; }
  .app.render .vignette, .app.render .loading { display: none; }
  .view { container-type: size; }
  .frame.fixed { width: min(100cqw, 100cqh * var(--arn)); height: auto; aspect-ratio: var(--ar); }

  /* transport bar */
  .bar { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(720px, calc(100% - 32px));
    background: rgba(16,18,22,.88); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; z-index: 3; }
  button { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 7px; height: 30px; min-width: 34px;
    padding: 0 9px; font: 12px var(--mono); cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.on, button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btns { display: flex; gap: 6px; }
  .scrubWrap { position: relative; }
  .apSpans { position: absolute; left: 8px; right: 8px; bottom: -3px; height: 3px; pointer-events: none; }
  .apSpans i { position: absolute; top: 0; bottom: 0; background: rgba(61,123,255,.55); border-radius: 2px; }
  input[type=range] { width: 100%; accent-color: var(--accent); position: relative; }
  .time { font: 11px var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
  .loading { position: absolute; inset: 0; pointer-events: none; display: grid; place-items: center; color: var(--dim); font: 12px var(--mono); z-index: 2; }
  .loadCard { width: min(280px, 70%); }
  .loadLabel { margin-bottom: 8px; letter-spacing: .06em; }
  .progress { height: 3px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .error { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; background: rgba(7,8,10,.9); z-index: 4; }
  .errCard { max-width: 520px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; }
  .errIcon { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: rgba(245,165,36,.14);
    color: var(--warn); font: 700 15px var(--mono); margin-bottom: 12px; }
  .errCard h2 { margin: 0 0 8px; font-size: 17px; font-weight: 600; }
  .errCard p { margin: 0; color: #b9bec8; line-height: 1.6; }
  .errCard code { font: 12px var(--mono); background: #1a1d23; padding: 1px 5px; border-radius: 4px; color: var(--text); }
  @media (max-width: 820px) {
    body { overflow: auto; }
    .app { grid-template-columns: 1fr; grid-template-rows: 60vh auto; height: auto; padding: 16px; }
    .stage { order: -1; height: 60vh; }
    .speed { font-size: 44px; }
  }
  @media (max-width: 560px) {
    .bar { grid-template-columns: auto auto; justify-content: space-between; row-gap: 8px; bottom: 12px; padding: 8px 10px; }
    .bar > div:nth-child(2) { grid-column: 1 / -1; order: -1; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="label" id="camsLabel">Dashcam</div>
    <div class="cams" id="cams"></div>
  </aside>
  <main class="stage" id="stage">
    <div class="view" id="view">
      <div class="frame" id="frame">
        <div class="vignette"></div>
        <div class="loading" id="loading" role="status">
          <div class="loadCard"><div class="loadLabel">loading splat <span id="loadPct"></span></div>
            <div class="progress" role="progressbar" aria-label="Loading splat" aria-valuemin="0" aria-valuemax="100"><i id="loadBar"></i></div></div>
        </div>
        <div class="error" id="error" role="alert" hidden>
          <div class="errCard"><div class="errIcon" aria-hidden="true">!</div><h2 id="errTitle"></h2><p id="errBody"></p></div>
        </div>
        <div class="hud" id="hud">
          <div class="hudTop" id="speedBlock" hidden>
            <div class="speed" id="speed">0</div>
            <div>
              <div class="gears" id="gears" aria-label="Gear"><span>P</span><span>R</span><span>N</span><span>D</span></div>
            </div>
          </div>
          <button class="unit" id="unit" title="Toggle mph / km/h" hidden>MPH</button>
          <div class="hudRow" id="hudRow" hidden>
            <svg class="sig" id="sigL" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10 4 2 12l8 8v-5h12V9H10z"/></svg>
            <svg class="wheel" id="wheel" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.6">
              <circle cx="16" cy="16" r="13"/><path d="M3.5 14.5h7.5M21 14.5h7.5M16 19.5v9" stroke-linecap="round"/>
              <circle cx="16" cy="15.5" r="4.2"/></g></svg>
            <svg class="sig" id="sigR" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14 4l8 8-8 8v-5H2V9h12z"/></svg>
          </div>
          <div class="chips" id="chips"></div>
        </div>
        <div class="toast" id="toast" role="status" hidden></div>
        <div class="meta" id="meta"><div class="date" id="date"></div><div id="metaSub"></div></div>
      </div>
    </div>
    <div class="bar" id="bar">
      <div class="btns">
        <button id="play" title="Play / pause (space)" aria-label="Play">▶</button>
        <button id="rate" title="Playback speed">1×</button>
      </div>
      <div>
        <div class="scrubWrap"><div class="apSpans" id="apSpans"></div>
          <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline"></div>
        <div class="time"><span id="tcur">0:00</span> / <span id="tdur">0:00</span></div>
      </div>
      <div class="btns">
        <button id="mChase" class="on" title="Chase camera">chase</button>
        <button id="mDriver" title="Driver view">driver</button>
        <button id="mFree" title="Free orbit">free</button>
        <button id="share" title="Copy a link to this moment">link</button>
      </div>
    </div>
  </main>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.2.0/dist/spark.module.js"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { toCreasedNormals } from "three/addons/utils/BufferGeometryUtils.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { SparkRenderer, SplatMesh, SplatEdit, SplatEditSdf, SplatEditSdfType, SplatEditRgbaBlendMode } from "@sparkjsdev/spark";

const $ = (id) => document.getElementById(id);
// ---- URL flags (share / record) ----
//   ?clean=1   hide the clip meta line and the raw camera panel (privacy for recordings)
//   ?ui=0      hide all UI chrome          ?aspect=16:9|9:16|1:1  lock the canvas aspect for recording
//   ?intro=0   skip the opening fly-in     ?render=1  deterministic render mode (see otrvRender below)
//   #t=12.4&cam=chase   deep link to a time and camera (the "link" button copies one)
const Q = new URLSearchParams(location.search);
const HASH = new URLSearchParams(location.hash.slice(1));
const RENDER = Q.get("render") === "1";
const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;
const app = $("app");
let uiOn = Q.get("ui") !== "0" && !RENDER;
app.classList.toggle("clean", Q.get("clean") === "1");
app.classList.toggle("noui", !uiOn);
app.classList.toggle("render", RENDER);
{
  const m = /^(\d+(?:\.\d+)?)[:x](\d+(?:\.\d+)?)$/.exec(Q.get("aspect") ?? "");
  if (m) { $("frame").classList.add("fixed"); $("frame").style.setProperty("--ar", `${m[1]} / ${m[2]}`); $("frame").style.setProperty("--arn", m[1] / m[2]); }
}
function setUi(on) { uiOn = on; app.classList.toggle("noui", !on); }
let toastTimer = 0;
function toast(msg, ms = 1800) {
  const el = $("toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.hidden = true), ms);
}
// ---- load states: progress bar, error card naming the cause ----
const halt = () => new Promise(() => {}); // stop module evaluation quietly after an error card
// render-mode handle exists from the first moment so a recorder can await it (API documented below)
let resolveReady, rejectReady;
const renderReady = new Promise((a, b) => { resolveReady = a; rejectReady = b; });
renderReady.catch(() => {});
window.otrvRender = { ready: renderReady, duration: NaN, frame: async () => { throw new Error("otrvRender: not ready yet, await otrvRender.ready"); } };
function showError(title, html) {
  rejectReady(new Error(title));
  $("loading").hidden = true;
  $("error").hidden = false;
  $("errTitle").textContent = title;
  $("errBody").innerHTML = html;
}
if (location.protocol === "file:") {
  showError("Open this viewer through a web server",
    "Browsers block <code>fetch()</code> of local files, so the splat and path can't load from <code>file://</code>.<br>" +
    "In the viewer folder run <code>python3 -m http.server 8000</code> and open <code>http://localhost:8000</code>.");
  await halt();
}
const [path, tel, plyHead] = await Promise.all([
  fetch("path.json").then(async (r) => (r.ok ? r.json() : { missing: r.status }), (e) => ({ missing: String(e) })).catch((e) => ({ broken: String(e) })),
  fetch("telemetry.json").then((r) => (r.ok ? r.json() : []), () => []).catch(() => []),
  fetch("scene.ply", { method: "HEAD" }).then((r) => r.status, () => 0),
]);
if (path.missing || path.broken || !path.frames?.length) {
  showError(path.broken ? "path.json is unreadable" : "path.json is missing",
    `The viewer needs <code>path.json</code> (the car's trajectory) next to <code>index.html</code>` +
    (path.missing ? ` (got ${path.missing}).` : path.broken ? ` but it failed to parse (${path.broken}).` : ", but it has no frames.") +
    `<br>Run <code>tsplat recon &lt;work-dir&gt;</code>; it writes <code>viewer/path.json</code>.`);
  await halt();
}
if (plyHead === 404) {
  showError("scene.ply not found (404)",
    "The Gaussian splat <code>scene.ply</code> isn't next to <code>index.html</code>.<br>" +
    "Run <code>tsplat recon &lt;work-dir&gt;</code> (it trains and copies the splat into <code>viewer/</code>), or copy a trained <code>.ply</code> there.");
  await halt();
}
const M = 1 / path.metresPerUnit;          // metres -> scene units
const UP = new THREE.Vector3(...path.up);
const frames = path.frames.map((f) => ({ t: f.t, p: new THREE.Vector3(...f.p), f: new THREE.Vector3(...f.f) }));
const DUR = path.dur;
$("metaSub").textContent = `${path.cams.length} cameras · gaussian splat`;
$("tdur").textContent = fmt(DUR);

// ---- side panel videos ----
const ORDER = ["front", "left_pillar", "right_pillar", "left_repeater", "right_repeater", "back"];
const videos = [];
for (const cam of ORDER.filter((c) => path.cams.includes(c))) {
  const d = document.createElement("div");
  d.className = "cam" + (cam === "front" || cam === "back" ? " wide" : "");
  const v = Object.assign(document.createElement("video"), { src: `cams/${cam}.mp4`, muted: true, playsInline: true, preload: "auto" });
  d.append(v, Object.assign(document.createElement("span"), { textContent: cam.replace("_", " ") }));
  $("cams").append(d);
  videos.push(v);
}
const lead = videos[0]; // master clock source while playing (front when present)
$("camsLabel").textContent = `Dashcam · ${videos.length} cameras`;

// ---- three / spark ----
const stage = $("frame");
// render mode needs an alpha channel (overlay layer) and a readable drawing buffer
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: RENDER, preserveDrawingBuffer: RENDER });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
// AgX for the car's lit materials. Spark's splat shader never includes three's tone-mapping chunk,
// so the reconstruction's colours pass through untouched (checked by pixel diff in testing).
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.05;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d10);
const camera = new THREE.PerspectiveCamera(45, 1, 0.05 * M, 2000 * M);
camera.up.copy(UP);
const spark = new SparkRenderer({ renderer });
scene.add(spark);

const splat = new SplatMesh({
  url: "scene.ply",
  onProgress: (e) => {
    if (!e.lengthComputable) return;
    const pct = Math.round((100 * e.loaded) / e.total);
    $("loadPct").textContent = `${pct}%`;
    $("loadBar").style.width = `${pct}%`;
    $("loadBar").parentElement.setAttribute("aria-valuenow", pct);
  },
});
let ready = false; // car, ribbon and playback wait for the splat
const sceneReady = splat.initialized.then(
  () => { $("loading").hidden = true; ready = true; },
  (err) => {
    console.warn("scene.ply failed to load", err);
    showError("scene.ply failed to load", `The splat file was found but couldn't be decoded: <code>${String(err?.message ?? err).replace(/</g, "&lt;")}</code>.<br>` +
      "Check that it's a 3DGS <code>.ply</code> (or re-export it with <code>tsplat recon</code>).");
    throw err;
  },
);
scene.add(splat);

// Ego-car clean-up: splats whose centres fall inside a box around the car (floaters and smeared
// reflections of our own car) are faded out with a Spark SDF edit. The road surface splats (centres
// below ~12 cm) are kept so the contact shadow sits on real road. Box half-extents are in metres
// because the edit lives in a group scaled by M (Spark divides out the world scale).
const egoHole = new THREE.Group();
{
  const edit = new SplatEdit({ rgbaBlendMode: SplatEditRgbaBlendMode.MULTIPLY, softEdge: 0.25 });
  const box = new SplatEditSdf({ type: SplatEditSdfType.BOX, opacity: 0, radius: 0.3 });
  box.scale.set(1.25, 1.1, 2.75); // half-extents: width, height, length (m)
  box.position.set(0, 0.12 + 1.1, 0);
  edit.add(box);
  egoHole.add(edit);
  egoHole.scale.setScalar(M);
}
scene.add(egoHole);

// ---- ego car ----
// An ORIGINAL stylised white crossover with Model Y-like proportions (4.75 m long, 1.92 m wide,
// 1.62 m tall, 2.89 m wheelbase), built entirely in code: no downloaded models, no logos, no copied
// design details. Car local axes: +z forward, +y up, +x = the car's left side; units are metres.
// Construction: side-profile shapes are extruded across the width, tessellated, bent with a
// tumblehome / plan-view rounding field, then given creased normals (smooth panels, crisp edges).
// Trim pieces (glass, cladding, lamps) are "shells" extruded from the same profile a few mm proud of
// the paint, so they always follow the body surface.
const CAR = { W: 1.92, bevel: 0.06, wheelR: 0.355, wheelZ: 1.445, track: 0.82, camZ: 0.8 };
const v2 = ([x, y]) => new THREE.Vector2(x, y);
const tumble = (y) => 1 - 0.24 * Math.min(1, Math.max(0, (y - 0.95) / 0.7)) ** 1.4;
const planRound = (z) => { const e = Math.max(0, (Math.abs(z) - 1.72) / 0.7); return 1 - 0.2 * e * e; };
const skirt = (y) => (y < 0.4 ? 1 - 0.06 * (0.4 - y) / 0.16 : 1);
// body outline above the floor, front bumper -> over the roof -> down the tail (x forward, y up)
const UPPER = new THREE.SplineCurve([[2.12, 0.26], [2.31, 0.34], [2.37, 0.5], [2.34, 0.65], [2.22, 0.75], [1.65, 0.85],
  [1.08, 0.95], [0.3, 1.47], [-0.4, 1.585], [-1.2, 1.54], [-1.78, 1.31], [-2.14, 1.11], [-2.29, 1.04], [-2.36, 0.8],
  [-2.35, 0.48], [-2.25, 0.28]].map(v2)).getSpacedPoints(200);
const nearestIdx = (x, y) => UPPER.reduce((best, p, i) => (p.distanceTo(v2([x, y])) < UPPER[best].distanceTo(v2([x, y])) ? i : best), 0);
// outward offset of a run of UPPER (which runs counter-clockwise around the profile)
function offsetRun(i0, i1, d) {
  const out = [];
  for (let i = i0; i <= i1; i++) {
    const a = UPPER[Math.max(0, i - 1)], b = UPPER[Math.min(UPPER.length - 1, i + 1)];
    const dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy) || 1;
    out.push(new THREE.Vector2(UPPER[i].x + (dy / l) * d, UPPER[i].y - (dx / l) * d));
  }
  return out;
}
// Crack-free refinement: split every edge whose extent in the (y, z) profile plane exceeds maxLen at
// its midpoint. The decision depends only on the edge, so both neighbouring triangles agree and no
// T-junctions appear. Edges running across the width stay long: the bend below is linear in x.
function refine(positions, maxLen, maxX = Infinity) {
  let src = positions;
  for (let iter = 0; iter < 10; iter++) {
    const out = [];
    let split = 0;
    const long = (a, b) => Math.hypot(src[a + 1] - src[b + 1], src[a + 2] - src[b + 2]) > maxLen || Math.abs(src[a] - src[b]) > maxX;
    const mid = (a, b) => [(src[a] + src[b]) / 2, (src[a + 1] + src[b + 1]) / 2, (src[a + 2] + src[b + 2]) / 2];
    const P = (i) => [src[i], src[i + 1], src[i + 2]];
    for (let i = 0; i < src.length; i += 9) {
      let [a, b, c] = [i, i + 3, i + 6];
      let ab = long(a, b), bc = long(b, c), ca = long(c, a);
      const n = ab + bc + ca;
      if (!n) { out.push(...P(a), ...P(b), ...P(c)); continue; }

const orbitCam = new THREE.PerspectiveCamera(45, 1, camera.near, camera.far);

const controls = new OrbitControls(orbitCam, renderer.domElement);
Object.assign(controls, { enabled: false, enableDamping: true, dampingFactor: 0.12, minDistance: 2.5 * M, maxDistance: 90 * M,
  minPolarAngle: 0.05, maxPolarAngle: 1.5, screenSpacePanning: true });

let mode = "chase";

const lastPose = newPose();

}
function setMode(m) {

function resetView(recentre = true) {

$("mChase").onclick = () => setMode("chase");
$("mDriver").onclick = () => setMode("driver");
$("mFree").onclick = () => setMode("free");

// follow-mode orbit / zoom: drag (any button) orbits, wheel / pinch zooms, double-click resets
{
  const el = renderer.domElement, pts = new Map();
  let pinch = 0;
  el.addEventListener("contextmenu", (e) => e.preventDefault());
  el.addEventListener("pointerdown", (e) => { if (mode === "free") return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); el.setPointerCapture?.(e.pointerId); });
  const end = (e) => { pts.delete(e.pointerId); pinch = 0; };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("pointermove", (e) => {
    if (mode === "free" || !pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId);

    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

}

// Camera pose for the current mode at the current clock (no blending).
const modePose = newPose(), tmpPose = newPose();
function computeModePose(ps) {

// ---- playback ----
// Starts paused; playback (and the intro fly-in) begin once the splat has loaded.
let clock = 0, playing = false, rate = 1, last = performance.now();
const RATES = [0.5, 1, 2, 4];
$("play").onclick = togglePlay;
$("rate").onclick = () => { rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length]; $("rate").textContent = rate + "×"; videos.forEach((v) => v.playbackRate = rate); };
addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  if (e.code === "KeyU") setUi(!uiOn); // H is the horn in drive mode
});
$("share").onclick = async () => {
  const url = `${location.origin}${location.pathname}${location.search}#t=${clock.toFixed(1)}&cam=${mode}`;
  history.replaceState(null, "", url);
  try { await navigator.clipboard.writeText(url); toast("Link copied"); } catch { toast("Link is in the address bar"); }
};
$("scrub").oninput = (e) => seek((e.target.value / 1000) * DUR);
function setPlaying(on) {
  playing = on && ready;
  $("play").textContent = playing ? "❚❚" : "▶";
  $("play").setAttribute("aria-label", playing ? "Pause" : "Play");
  videos.forEach((v) => playing ? v.play().catch(() => {}) : v.pause());
}

setPlaying(false);
sceneReady.then(() => {
  if (RENDER) return;
  const cam = HASH.get("cam"), t = parseFloat(HASH.get("t"));
  if (["chase", "driver", "free"].includes(cam)) { setMode(cam); blend = null; }
  if (Number.isFinite(t)) seek(t);
  if (!REDUCED_MOTION) setPlaying(true);

}, () => {});

function fmtDate(t) {

let kmh = false;

// tint Autopilot-engaged spans on the scrubber

// place car + clean-up box at a pose and apply telemetry-driven lamps / steering

  car.quaternion.copy(ps.q);
  car.position.copy(ps.carPos);
  egoHole.position.copy(car.position); egoHole.quaternion.copy(car.quaternion);
  const s = telAt(t);

}

  return !(Math.abs(l.x) < 1.15 && l.y < 1.9 && Math.abs(l.z) < 2.6);
}

  key.position.copy(camera.position).addScaledVector(UP, 4 * M).addScaledVector(camera.getWorldDirection(_v), -3 * M);
  key.target.position.copy(car.position);
}

function loop(now) {

    if (lead && !lead.paused && !lead.seeking && lead.readyState >= 3 && Math.abs(lead.currentTime - clock) < 1) clock = lead.currentTime;
    else clock += dt * rate;

  for (const v of videos) {
    if ((playing && v === lead && Math.abs(clock - v.currentTime) < 1) || v.readyState < 2 || v.seeking || clock >= v.duration) continue;
    const d = clock - v.currentTime;
    if (!playing || Math.abs(d) > 1) { if (Math.abs(d) > 0.15) v.currentTime = clock; v.playbackRate = rate; }
    else v.playbackRate = rate * (1 + Math.max(-0.25, Math.min(0.25, d)));

  placeCar(ps, clock);
  updateRibbon(clock);

}

/* ---- Deterministic render mode: window.otrvRender ----------------------------------------------
 * For offline compositing / video export. Open the viewer with ?render=1 (implies ui=0, intro=0, no
 * autoplay; DPR defaults to 1, override with ?dpr=2). The interactive loop is off; frames are only
 * drawn on request.
 *
 *   otrvRender.ready      Promise<void>: resolves once path.json + scene.ply are loaded; rejects with
 *                         the error-card title if loading failed.
 *   otrvRender.duration   clip length in seconds (path.json "dur").
 *   await otrvRender.frame(t, layer = "full", { cam = "chase" } = {})
 *       -> { t, layer, cam, width, height, sortFrames }
 *     t      clip time in seconds (clamped to [0, duration]).
 *     layer  "splat"   the reconstruction only; car, ribbon and contact shadow hidden; opaque.
 *            "overlay" car + ribbon + contact shadow over a TRANSPARENT background (clear alpha 0,
 *                      straight alpha in toDataURL / screenshots); the splat is hidden.
 *            "full"    everything (no UI chrome); opaque.
 *     cam    "chase" | "driver".
 *   What a call does: sets the clock to t and pauses the camera videos; poses car, lamps, wheels,
 *   ribbon and camera with no smoothing lag (the chase heading spring is simulated from t-3 s at a
 *   fixed 60 Hz, so the image depends only on t); then renders frames until Spark's asynchronous
 *   sort has caught up with this exact view (sortedCenter == camera position, no sort in flight or
 *   pending, stable for 3 consecutive rAFs, at least 3 rAFs, at most ~4 s); finally renders once more
 *   and calls gl.finish(). The drawing buffer is preserved, so canvas.toDataURL() or a page

}
let renderBusy = Promise.resolve();
async function renderFrame(t, layer = "full", { cam = "chase" } = {}) {
  if (!["splat", "overlay", "full"].includes(layer)) throw new Error(`otrvRender: unknown layer "${layer}"`);
  t = clamp(+t || 0, 0, DUR);
  clock = t;
  setPlaying(false);
  for (const v of videos) { v.pause(); if (v.readyState) v.currentTime = Math.min(t, v.duration || t); }
  // deterministic pose: no blend, no intro, no user offsets, spring settled for this t
  blend = null; intro = null;
  Object.assign(view, { yaw: 0, pitch: 0, zoom: 1, idle: 99 });
  const ps = poseAt(t);

  updateRibbon(t);

  applyPose(modePose);

  car.visible = overlay && carVisibleFrom(camera);
  ribbon.visible = overlay;
  // hide the SparkRenderer mesh itself: hiding only the SplatMesh would still draw the last sorted splats
  spark.visible = splat.visible = layer !== "overlay";
  scene.background = layer === "overlay" ? null : BG;
  renderer.setClearColor(0x000000, layer === "overlay" ? 0 : 1);

  hud(t);

    for (; frames < 240 && stable < 3; frames++) {
      renderer.render(scene, camera);

      stable = frames >= 2 && sparkSettled() ? stable + 1 : 0;

  renderer.setPixelRatio(Number.isFinite(dpr) && dpr > 0 ? dpr : 1);
  resize();

    duration: DUR,
    // calls are serialised so overlapping requests can't interleave poses
    frame: (t, layer, opts) => (renderBusy = renderBusy.then(() => renderFrame(t, layer, opts), () => renderFrame(t, layer, opts))),
  });

}
