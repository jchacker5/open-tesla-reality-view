[project]
name = "open-tesla-reality-view"
version = "0.1.0"
description = "Tesla dashcam (4 or 6 cameras) -> 3D Gaussian splat replay"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pillow>=10", "scipy>=1.11"]

[project.optional-dependencies]
movers = ["ultralytics>=8.3"]
# `otrv render`: headless Chromium drives the viewer. Then: `uv run playwright install chromium`.
render = ["playwright>=1.49"]
# `otrv render --enhance`: NVIDIA Difix (weights under the NVIDIA License, non-commercial; see docs/RENDER.md).
# Pinned to the versions Difix3D was released against. Incompatible with `quality`'s newer transformers.
enhance = [
  "torch>=2.2",
  "diffusers==0.25.1",
  "transformers==4.38.0",
  "huggingface-hub==0.25.1",
  "peft==0.9.0",
  "einops",
  "accelerate",
  "opencv-python-headless>=4.8",
]
# Bench v2 LPIPS, Depth Anything V2 dense init, the sky segmentation model: ~1 GB (PyTorch).
quality = ["torch>=2.3", "torchvision>=0.18", "lpips>=0.1.4", "transformers>=4.45"]
# C++ core (cpp/): faster SEI decoding and the native splat renderer. Needs CMake 3.20+ and a C++20 compiler.
native = ["otrv-native"]
studio = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
]

[project.scripts]
otrv = "tsplat.__main__:main"
tsplat = "tsplat.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv.sources]
otrv-native = { path = "cpp" }

# Difix pins transformers 4.38; bench v2 needs transformers 4.45+. Install one extra at a time.
[tool.uv]
conflicts = [
  [
    { extra = "enhance" },
    { extra = "quality" },
  ],
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["tsplat"]

# Ship the viewer inside the package so `otrv view` works from a wheel install. The source stays
# at viewer/index.html; a source checkout (incl. editable installs) reads it from there.
[tool.hatch.build.targets.wheel.force-include]
"viewer/index.html" = "tsplat/viewer/index.html"
"viewer/car.js" = "tsplat/viewer/car.js"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
