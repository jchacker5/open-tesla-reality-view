<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive Replay</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #07080a; --panel: #101216; --line: #1f232a; --text: #e8eaee; --dim: #8a909c;
    --accent: #3d7bff; --ok: #3ecf8e; --warn: #f5a524;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; overflow: hidden; }
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100%; gap: 10px; padding: 10px; }
  .side { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .label { font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 2px 2px 6px; }
  .cams { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: min-content; gap: 6px; overflow: auto; flex: 1; min-height: 0; }
  .mapwrap { position: relative; height: 230px; flex: none; margin-top: 8px; border-radius: 8px; overflow: hidden; background: #101216; }
  #map { height: 100%; width: 100%; background: #101216; }
  .maplabel { position: absolute; z-index: 500; left: 8px; top: 8px; max-width: 70%; pointer-events: none;
    font: 11px var(--mono); color: var(--text); background: rgba(16,18,22,.82); border: 1px solid var(--line);
    border-radius: 4px; padding: 3px 6px; }
  #mapFollow { position: absolute; z-index: 500; right: 8px; top: 8px; height: 24px; }
  .leaflet-container { font: 11px var(--mono); background: #101216; }
  .cam { position: relative; background: #000; border-radius: 6px; overflow: hidden; aspect-ratio: 4/3; }
  .cam.wide { grid-column: span 2; aspect-ratio: 16/10; }
  .cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cam span { position: absolute; left: 6px; bottom: 6px; font: 10px var(--mono); letter-spacing: .06em;
    background: rgba(0,0,0,.65); padding: 2px 5px; border-radius: 3px; text-transform: uppercase; }
  .stage { position: relative; border-radius: 10px; overflow: hidden; background: #000; min-width: 0; }
  .stage > canvas { display: block; width: 100%; height: 100%; }
  button.rec { border-color: #ff3355; color: #ff3355; }
  .hud { position: absolute; top: 16px; left: 18px; pointer-events: none; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .speed { font-size: 64px; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; }
  .unit { font: 11px var(--mono); color: var(--dim); letter-spacing: .1em; }
  .chips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .chip { font: 11px var(--mono); padding: 3px 7px; border-radius: 4px; background: rgba(16,18,22,.75); border: 1px solid var(--line); }
  .chip.on { color: var(--accent); border-color: var(--accent); }
  .chip.warn { color: var(--warn); border-color: var(--warn); }
  .meta { position: absolute; top: 16px; right: 18px; text-align: right; font: 11px var(--mono); color: var(--dim); pointer-events: none; }
  .bar { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(560px, calc(100% - 32px));
    background: rgba(16,18,22,.88); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
  button { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 7px; height: 30px; min-width: 34px;
    padding: 0 9px; font: 12px var(--mono); cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.on { border-color: var(--accent); color: var(--accent); }
  .btns { display: flex; gap: 6px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .time { font: 11px var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
  .loading { position: absolute; inset: 0; pointer-events: none; display: grid; place-items: center; color: var(--dim); font: 12px var(--mono); }
  @media (max-width: 820px) {
    body { overflow: auto; }
    .app { grid-template-columns: 1fr; grid-template-rows: 60vh auto; height: auto; padding: 16px; }
    .stage { order: -1; height: 60vh; }
    .mapwrap { height: 200px; }
    .speed { font-size: 44px; }
  }
  @media (max-width: 560px) {
    .bar { grid-template-columns: auto auto; justify-content: space-between; row-gap: 8px; bottom: 12px; padding: 8px 10px; }
    .bar > div:nth-child(2) { grid-column: 1 / -1; order: -1; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="label" id="camsLabel">Dashcam</div>
    <div class="cams" id="cams"></div>
    <div class="mapwrap">
      <div id="map"></div>
      <div class="maplabel" id="mapLabel">locating…</div>
      <button id="mapFollow" class="on" title="Keep the map on the car">follow</button>
    </div>
  </aside>
  <main class="stage" id="stage">
    <div class="loading" id="loading">loading splat…</div>
    <div class="hud">
      <div class="speed" id="speed">—</div>
      <div class="unit">MPH</div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="meta" id="meta"></div>
    <div class="bar">
      <div class="btns">
        <button id="play" title="Play / pause (space)">❚❚</button>
        <button id="rate" title="Playback speed">1×</button>
      </div>
      <div>
        <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline">
        <div class="time"><span id="tcur">0:00</span> / <span id="tdur">0:00</span></div>
      </div>
      <div class="btns">
        <button id="mChase" class="on" title="Reality View drone, high behind the car">drone</button>
        <button id="mDriver" title="Driver view">driver</button>
        <button id="mFree" title="Free orbit">free</button>
        <button id="record" title="Record the whole window: every camera, the map, and the main view">record</button>
      </div>
    </div>
  </main>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.2.0/dist/spark.module.js"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

const $ = (id) => document.getElementById(id);
const [path, tel] = await Promise.all([
  fetch("path.json").then((r) => r.json()),
  fetch("telemetry.json").then((r) => r.json()).catch(() => []),
]);
const M = 1 / path.metresPerUnit;          // metres -> scene units
const UP = new THREE.Vector3(...path.up);
const frames = path.frames.map((f) => ({ t: f.t, p: new THREE.Vector3(...f.p), f: new THREE.Vector3(...f.f) }));
const DUR = path.dur;
$("meta").innerHTML = `${path.timestamp ?? path.clip}<br>${path.cams.length} cameras · gaussian splat`;
$("tdur").textContent = fmt(DUR);

// ---- side panel videos ----
const ORDER = ["front", "left_pillar", "right_pillar", "left_repeater", "right_repeater", "back"];
const videos = [];
for (const cam of ORDER.filter((c) => path.cams.includes(c))) {
  const d = document.createElement("div");
  d.className = "cam" + (cam === "front" || cam === "back" ? " wide" : "");
  const v = Object.assign(document.createElement("video"), { src: `cams/${cam}.mp4`, muted: true, playsInline: true, preload: "auto" });
  d.append(v, Object.assign(document.createElement("span"), { textContent: cam.replace("_", " ") }));
  $("cams").append(d);
  videos.push(v);
}
const lead = videos[0]; // master clock source while playing (front when present)
$("camsLabel").textContent = `Dashcam · ${videos.length} cameras`;

// ---- three / spark ----
const stage = $("stage");
const renderer = new THREE.WebGLRenderer({
  antialias: false,
  powerPreference: "high-performance",
  preserveDrawingBuffer: true, // the one-click recorder copies this canvas after each frame
});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d10);
const camera = new THREE.PerspectiveCamera(48, 1, 0.05 * M, 2000 * M);
camera.up.copy(UP);
// Street stills are milky off the driven path: faint splats veil the scene and a few
// huge splats streak into lines. Clip those. On-path surfaces stay.
scene.add(new SparkRenderer({
  renderer,
  maxStdDev: 2,
  maxPixelRadius: 96,
  minAlpha: 4 / 255,
  blurAmount: 0.12,
}));

const splat = new SplatMesh({
  url: "scene.ply",
  onProgress: (e) => { if (e.lengthComputable) $("loading").textContent = `loading splat… ${Math.round((100 * e.loaded) / e.total)}%`; },
});
splat.initialized.then(
  () => $("loading").remove(),
  (err) => { console.error("scene.ply failed to load", err); $("loading").textContent = "splat unavailable (scene.ply failed to load)"; },
);
scene.add(splat);

// Stand-in only. The car on screen is the installed Model Y GLB (otrv view copies
// ~/.otrv/models next to this page). This mesh shows if that file is missing or fails to load.
// Local axes: +z forward, +y up, metres.
const car = new THREE.Group();
function profileMesh(points, width, material, bevel = 0.06) {
  const shape = new THREE.Shape(points.map(([x, y]) => new THREE.Vector2(x, y)));
  const g = new THREE.ExtrudeGeometry(shape, { depth: width - 2 * bevel, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 4, curveSegments: 8 });
  g.translate(0, 0, -(width - 2 * bevel) / 2);
  g.rotateY(-Math.PI / 2); // shape x (length) -> +z forward
  // Shape the slab: tumblehome toward the roof, rounded nose/tail in plan view.
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i), z = pos.getZ(i);
    const tumble = 1 - 0.24 * Math.min(1, Math.max(0, (y - 0.95) / 0.7)) ** 1.4;
    const end = Math.max(0, (Math.abs(z) - 1.75) / 0.7);
    const plan = 1 - 0.2 * end * end;
    const skirt = y < 0.4 ? 1 - 0.06 * (0.4 - y) / 0.16 : 1;
    pos.setX(i, pos.getX(i) * tumble * plan * skirt);
  }
  g.computeVertexNormals();
  return new THREE.Mesh(g, material);
}
const paint = new THREE.MeshPhysicalMaterial({ color: 0xf4f5f7, roughness: 0.28, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.08 });
const glass = new THREE.MeshPhysicalMaterial({ color: 0x0b0d12, roughness: 0.05, metalness: 0.6, clearcoat: 1 });
const black = new THREE.MeshStandardMaterial({ color: 0x111316, roughness: 0.6 });
// side profile (x: rear -2.375 .. front +2.375, y: up), smooth fastback crossover
const BODY = [[-2.2, 0.24], [2.2, 0.24], [2.36, 0.34], [2.39, 0.56], [2.3, 0.72], [1.95, 0.82], [1.2, 0.95],
  [0.35, 1.5], [-0.35, 1.6], [-1.15, 1.56], [-1.75, 1.36], [-2.2, 1.08], [-2.34, 1.02], [-2.38, 0.86], [-2.37, 0.36]];
car.add(profileMesh(BODY, 1.92, paint));
// greenhouse: dark glass from the beltline up (glass roof, windscreen, rear window, side glass)
const GLASS = [[1.12, 0.99], [0.34, 1.53], [-0.35, 1.63], [-1.16, 1.59], [-1.76, 1.39], [-2.08, 1.15], [-1.9, 1.06], [0.9, 1.0]];
car.add(profileMesh(GLASS, 1.8, glass, 0.05));
// wheels (aero-style dark discs) at the wheelbase
for (const z of [1.445, -1.445]) for (const x of [-0.84, 0.84]) {
  const w = new THREE.Mesh(new THREE.CylinderGeometry(0.355, 0.355, 0.26, 28), black);
  w.rotation.z = Math.PI / 2;
  w.position.set(x, 0.355, z);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.265, 24), new THREE.MeshStandardMaterial({ color: 0x3a3e45, metalness: 0.8, roughness: 0.3 }));
  cap.rotation.z = Math.PI / 2;
  cap.position.copy(w.position);
  car.add(w, cap);
}
// full-width tail light bar and slim headlights
const tail = new THREE.Mesh(new THREE.BoxGeometry(1.45, 0.05, 0.04), new THREE.MeshBasicMaterial({ color: 0xff2a3a }));
tail.position.set(0, 1.0, -2.45);
const brake = new THREE.MeshBasicMaterial({ color: 0xff2a3a });
for (const x of [-0.72, 0.72]) {
  const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.09, 0.04), brake);
  lamp.position.set(x * 0.92, 0.98, -2.44);
  car.add(lamp);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.05, 0.04), new THREE.MeshBasicMaterial({ color: 0xeaf2ff }));
  head.position.set(x * 0.95, 0.68, 2.36);
  head.rotation.x = -0.3;
  car.add(head);
}
car.add(tail);
car.scale.setScalar(M);
car.visible = false;
scene.add(car);
// ~/.otrv/models/car.glb is the 2025 Model Y from BloxBloger, painted white. otrv view copies it here.
useInstalledCar();

function materialLabel(obj) {
  const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
  return `${obj.name} ${mats.map((m) => m?.name || "").join(" ")}`;
}
function lowestY(root, pattern) {
  let y = Infinity;
  root.traverse((obj) => {
    if (!obj.isMesh || (pattern && !pattern.test(materialLabel(obj)))) return;
    const box = new THREE.Box3().setFromObject(obj);
    if (!box.isEmpty()) y = Math.min(y, box.min.y);
  });
  return y;
}
// Body panels only. Glass, lamps, and anything the name says is not paint stay as authored.
function applyCarPaint(root, paint) {
  if (!paint || paint === "none") return;
  const color = new THREE.Color(paint);
  const skip = /glass|window|windshield|windscreen|sunroof|lamp|light|lens|led|headlamp|tire|tyre|wheel|rim|brake|caliper|rotor|interior|leather|seat|carpet|trim|rubber/i;
  const body = /paint|body.?colou?r|carpaint|shell/i;
  const clones = new Map();
  root.traverse((obj) => {
    if (!obj.isMesh) return;
    const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
    let changed = false;
    const next = mats.map((mat) => {
      if (!mat) return mat;
      const label = `${obj.name} ${mat.name || ""}`;
      if (skip.test(label) || !body.test(label)) return mat;
      let copy = clones.get(mat);
      if (!copy) {
        copy = mat.clone();
        copy.color.copy(color);
        clones.set(mat, copy);
      }
      changed = true;
      return copy;
    });
    if (changed) obj.material = Array.isArray(obj.material) ? next : next[0];
  });
}
// Length axis and which end is the nose come from the loaded bounds (headlights vs tail lamps).
// Scale to lengthM metres, yaw so the nose is +Z, then sit the tires on local y=0.
function fitCarModel(root, cfg) {
  root.updateMatrixWorld(true);
  const bounds = new THREE.Box3().setFromObject(root);
  const size = bounds.getSize(new THREE.Vector3());
  const alongX = size.x > size.z;
  const coord = (v) => (alongX ? v.x : v.z);
  let frontSum = 0, frontN = 0, rearSum = 0, rearN = 0;
  root.traverse((obj) => {
    if (!obj.isMesh) return;
    const label = materialLabel(obj);
    const rear = /taillight|tail.?light|rear.?lamp/i.test(label);
    const front = !rear && /signature|headlight|headlamp|front.?light|\bdrl\b/i.test(label);
    if (!front && !rear) return;
    const c = coord(new THREE.Box3().setFromObject(obj).getCenter(new THREE.Vector3()));
    if (front) { frontSum += c; frontN++; } else { rearSum += c; rearN++; }
  });
  let nose = 0;
  if (frontN && rearN) nose = frontSum / frontN >= rearSum / rearN ? 1 : -1;
  else if (frontN || rearN) {
    const mid = (coord(bounds.min) + coord(bounds.max)) / 2;
    const at = frontN ? frontSum / frontN : rearSum / rearN;
    const end = at >= mid ? 1 : -1;
    nose = frontN ? end : -end;
  }
  const yaw = !nose ? 0 : alongX ? (nose > 0 ? -Math.PI / 2 : Math.PI / 2) : (nose > 0 ? 0 : Math.PI);
  const measured = Math.max(alongX ? size.x : size.z, 1e-6);
  const lengthM = Number(cfg.lengthM) > 0 ? Number(cfg.lengthM) : measured;
  const fit = new THREE.Group();
  fit.rotation.y = yaw;
  fit.scale.setScalar(lengthM / measured);
  fit.add(root);
  fit.updateMatrixWorld(true);
  let ground = lowestY(fit, /tire|tyre/i);
  if (!Number.isFinite(ground)) ground = lowestY(fit, /wheel|rim/i);
  if (!Number.isFinite(ground)) ground = new THREE.Box3().setFromObject(fit).min.y;
  if (Number.isFinite(ground)) fit.position.y = -ground;
  return fit;
}
function useInstalledCar() {
  const standIn = () => { car.visible = true; };
  fetch("models/car.json").then((r) => (r.ok ? r.json() : null)).then((cfg) => {
    if (!cfg?.file) { standIn(); return; }
    const parts = String(cfg.file).split("/");
    if (parts.some((part) => !part || part === "." || part === "..")) throw new Error("bad car file");
    const loader = new GLTFLoader();
    loader.setMeshoptDecoder(MeshoptDecoder);
    const url = "models/" + parts.map(encodeURIComponent).join("/");
    return loader.loadAsync(url).then((gltf) => {
      applyCarPaint(gltf.scene, cfg.paint || "#f2f3f5");
      car.clear();
      car.add(fitCarModel(gltf.scene, cfg));
      car.scale.setScalar(M);
      car.visible = true;
      if (cfg.credit) {
        const line = document.createElement("div");
        line.textContent = cfg.credit;
        line.style.maxWidth = "320px";
        line.style.marginLeft = "auto";
        $("meta").append(document.createElement("br"), line);
      }
    });
  }).catch((err) => { console.error("installed car failed; keeping the stand-in", err); standIn(); });
}
scene.add(new THREE.HemisphereLight(0xdfe6f0, 0x2a2a2a, 1.2));
// studio reflections for the car paint (splats ignore scene.environment)
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.copy(UP).multiplyScalar(100);
scene.add(sun);

// Planned-path ribbon: next few seconds of trajectory, laid on the road.
const RIBBON_PTS = 40;
const ribbonGeo = new THREE.BufferGeometry();
ribbonGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(RIBBON_PTS * 2 * 3), 3));
const idx = [];
for (let i = 0; i < RIBBON_PTS - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
ribbonGeo.setIndex(idx);
const ribbon = new THREE.Mesh(ribbonGeo, new THREE.MeshBasicMaterial({ color: 0x3d7bff, transparent: true, opacity: .75, side: THREE.DoubleSide, depthWrite: false }));
scene.add(ribbon);

const CAM_HEIGHT = 1.4; // front camera height above road (m)
function poseAt(t) {
  t = Math.max(frames[0].t, Math.min(frames.at(-1).t, t));
  let i = frames.findIndex((f) => f.t >= t);
  if (i <= 0) i = 1;
  const a = frames[i - 1], b = frames[i];
  const k = b.t === a.t ? 0 : (t - a.t) / (b.t - a.t);
  const p = a.p.clone().lerp(b.p, k);
  const f = a.f.clone().lerp(b.f, k).normalize();
  const road = p.clone().addScaledVector(UP, -CAM_HEIGHT * M);
  return { p, f, road };
}
function updateRibbon(t) {
  const pos = ribbonGeo.attributes.position.array;
  for (let i = 0; i < RIBBON_PTS; i++) {
    const { road, f } = poseAt(t + 0.4 + i * 0.12);
    const side = new THREE.Vector3().crossVectors(f, UP).normalize().multiplyScalar(.45 * M);
    const c = road.addScaledVector(UP, .05 * M);
    c.clone().add(side).toArray(pos, i * 6);
    c.clone().sub(side).toArray(pos, i * 6 + 3);
  }
  ribbonGeo.attributes.position.needsUpdate = true;
  ribbonGeo.computeBoundingSphere();
}

// ---- camera modes ----
// Reality View drone, matched to Tesla's high rear view (and Vogel's FSD 15 recreation of it):
// centered behind the car, high enough that the roof is in frame, car sitting low-center,
// horizon in the upper third. 11 m back, 8 m up, looking 2.5 m ahead of the rear axle.
const DRONE_BACK = 11, DRONE_UP = 8, DRONE_AHEAD = 2.5, DRONE_LOOK_H = 0.8;
const controls = new OrbitControls(camera, renderer.domElement);
controls.enabled = false;
let mode = "drone";
const smoothPos = new THREE.Vector3(), smoothLook = new THREE.Vector3();
let first = true;
function setMode(m) {
  mode = m;
  for (const [id, n] of [["mChase", "drone"], ["mDriver", "driver"], ["mFree", "free"]]) $(id).classList.toggle("on", n === m);
  controls.enabled = m === "free";
  if (m === "free") controls.target.copy(poseAt(clock).road);
  first = true;
}
$("mChase").onclick = () => setMode("drone");
$("mDriver").onclick = () => setMode("driver");
$("mFree").onclick = () => setMode("free");

// ---- playback ----
let clock = 0, playing = true, rate = 1, last = performance.now();
const RATES = [0.5, 1, 2, 4];
$("play").onclick = togglePlay;
$("rate").onclick = () => { rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length]; $("rate").textContent = rate + "×"; videos.forEach((v) => v.playbackRate = rate); };
addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); togglePlay(); } });
$("scrub").oninput = (e) => seek((e.target.value / 1000) * DUR);
function togglePlay() { playing = !playing; $("play").textContent = playing ? "❚❚" : "▶"; videos.forEach((v) => playing ? v.play().catch(() => {}) : v.pause()); }
function seek(t) { clock = t; videos.forEach((v) => { v.currentTime = t; if (playing && v.paused) v.play().catch(() => {}); }); }
videos.forEach((v) => v.play().catch(() => {}));

      ? road.clone().addScaledVector(f, DRONE_AHEAD * M).addScaledVector(UP, DRONE_LOOK_H * M)
      : p.clone().add(f);
    const k = first || mode === "driver" ? 1 : 1 - Math.exp(-dt / 0.28);
    smoothPos.lerp(want, k); smoothLook.lerp(look, k); first = false;
    camera.position.copy(smoothPos);
    camera.lookAt(smoothLook);
  } else {
    controls.update();
  }
  hud(clock);
  updateMap(clock);
  renderer.render(scene, camera);
  if (rec) {
    paintRecording();
    const sec = Math.round((performance.now() - rec.started) / 1000);
    $("record").textContent = `stop ${fmt(sec)}`;
  }
});
</script>
</body>
</html>
