[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "otrv-native"
version = "0.1.0"
description = "C++ core of Open Tesla Reality View: SEI telemetry decoder, GPS georeferencing, Gaussian-splat renderer"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["python/otrv_native"]
