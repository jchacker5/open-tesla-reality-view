name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev --extra studio
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # otrv render's real capture loop: Playwright drives Chromium on SwiftShader (CPU WebGL, no GPU) through a
  # fake viewer page, then ffmpeg encodes. OTRV_REQUIRE_RENDER_TEST turns a missing browser into a failure.
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --locked --group dev --extra render
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q -rs tests/test_render.py
        env:
          OTRV_RENDER_SWIFTSHADER: "1"
          OTRV_REQUIRE_RENDER_TEST: "1"

  # End to end on synthetic footage: real ffmpeg, rsync and SEI parsing; COLMAP/Brush are skipped.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --locked
      - name: Paths (footage via OTRV_DATA, the global data-dir setting)
        run: |
          echo "USB=$RUNNER_TEMP/usb/TeslaCam" >> "$GITHUB_ENV"
          echo "OTRV_DATA=$RUNNER_TEMP/teslacam" >> "$GITHUB_ENV"
      - name: Generate a 4-camera TeslaCam clip (testsrc2) plus a Sentry clip
        run: |
          mkdir -p "$USB/RecentClips" "$USB/SentryClips/2026-01-01_00-00-00"
          for cam in front back left_repeater right_repeater; do
            ffmpeg -loglevel error -f lavfi -i testsrc2=size=640x480:rate=30 -t 8 -pix_fmt yuv420p \
              "$USB/RecentClips/2026-01-02_03-04-05-$cam.mp4"
          done
          cp "$USB/RecentClips/2026-01-02_03-04-05-front.mp4" \
            "$USB/SentryClips/2026-01-01_00-00-00/2026-01-01_00-00-00-front.mp4"
      - name: otrv ingest && otrv list && otrv prep
        run: |
          uv run otrv ingest --src "$USB" && uv run otrv list && \
            uv run otrv prep 2026-01-02_03-04-05 --name ci --start 1 --dur 4 --fps 2
      - name: Check prep outputs
        run: |
          test ! -e "$OTRV_DATA/SentryClips"   # Sentry is opt-in
          for cam in front back left_repeater right_repeater; do
            test "$(ls work/ci/images/$cam | wc -l)" -eq 8
            test "$(ls work/ci/masks/$cam | wc -l)" -eq 8
            test -s "work/ci/viewer/cams/$cam.mp4"
          done
          test -s work/ci/pairs.txt && test -s work/ci/rig_config.json && test -f work/ci/viewer/telemetry.json
          python3 -c "import json; m = json.load(open('work/ci/meta.json')); assert m['dur'] == 4.0 and len(m['cams']) == 4, m"
      - name: Re-prep a shorter window leaves no stale frames
        run: |
          uv run otrv prep 2026-01-02_03-04-05 --name ci --start 0 --dur 2 --fps 2
          test "$(ls work/ci/images/front | wc -l)" -eq 4
      - name: Wheel ships the viewer
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          unzip -l "$RUNNER_TEMP"/dist/*.whl | grep -q "tsplat/viewer/index.html"
          unzip -l "$RUNNER_TEMP"/dist/*.whl | grep -q "tsplat/studio/static/app.js"
      - name: Friendly failures
        run: |
          if uv run otrv prep 2026-01-02_03-04-05 --name bad --start 7 --dur 5 2>err.txt; then exit 1; fi
          grep -q "runs past the end" err.txt
          if uv run otrv view ci 2>err.txt; then exit 1; fi
          grep -q "run \`otrv recon ci\` first" err.txt

  # C++ core (cpp/): unit tests under ASan + UBSan, a -Werror release build, then the Python extension
  # checked against the pure-Python decoder on fuzzed input and a real H.264 clip with SEI telemetry.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: native (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: C++ unit tests (ASan + UBSan, warnings as errors)
        run: |
          cmake -S cpp -B build/asan -DCMAKE_BUILD_TYPE=Debug -DOTRV_SANITIZE=ON -DOTRV_WERROR=ON
          cmake --build build/asan --parallel
          ctest --test-dir build/asan --output-on-failure
      - name: Release build
        run: |
          cmake -S cpp -B build/release -DCMAKE_BUILD_TYPE=Release -DOTRV_WERROR=ON
          cmake --build build/release --parallel
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --locked --group dev --extra studio --extra native
      - if: runner.os == 'Linux'
        name: Real H.264 clip with SEI telemetry (ffmpeg testsrc2 + injected SEI)
        run: |
          uv run python -c "from pathlib import Path; from tsplat.studio import synth; synth.make_teslacam(Path('$RUNNER_TEMP/TeslaCam'), seconds=20)"
          echo "OTRV_PARITY_CLIP=$(ls "$RUNNER_TEMP"/TeslaCam/RecentClips/*-front.mp4 | head -1)" >> "$GITHUB_ENV"
      - name: Parity (SEI decoder vs Python, renderer vs brute force), georef, snapshot
        run: uv run pytest -q -rs tests/test_sei.py tests/test_sei_native.py tests/test_georef.py tests/test_render_native.py
        env:
          OTRV_REQUIRE_NATIVE: "1"
          OTRV_SEI_BIN: build/release/otrv-sei
      - name: Full suite with the native decoder installed
        run: uv run pytest -q
