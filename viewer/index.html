<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive Replay</title>
<style>
  :root {
    --bg: #07080a; --panel: #101216; --line: #1f232a; --text: #e8eaee; --dim: #8a909c;
    --accent: #3d7bff; --ok: #3ecf8e; --warn: #f5a524;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; overflow: hidden; }
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100%; gap: 10px; padding: 10px; }
  .label { font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 2px 2px 6px; }
  .cams { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: min-content; gap: 6px; overflow: auto; }
  .cam { position: relative; background: #000; border-radius: 6px; overflow: hidden; aspect-ratio: 4/3; }
  .cam.wide { grid-column: span 2; aspect-ratio: 16/10; }
  .cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cam span { position: absolute; left: 6px; bottom: 6px; font: 10px var(--mono); letter-spacing: .06em;
    background: rgba(0,0,0,.65); padding: 2px 5px; border-radius: 3px; text-transform: uppercase; }
  .stage { position: relative; border-radius: 10px; overflow: hidden; background: #000; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; top: 16px; left: 18px; pointer-events: none; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .speed { font-size: 64px; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; }
  .unit { font: 11px var(--mono); color: var(--dim); letter-spacing: .1em; }
  .chips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .chip { font: 11px var(--mono); padding: 3px 7px; border-radius: 4px; background: rgba(16,18,22,.75); border: 1px solid var(--line); }
  .chip.on { color: var(--accent); border-color: var(--accent); }
  .chip.warn { color: var(--warn); border-color: var(--warn); }
  .meta { position: absolute; top: 16px; right: 18px; text-align: right; font: 11px var(--mono); color: var(--dim); pointer-events: none; }
  .bar { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(560px, calc(100% - 32px));
    background: rgba(16,18,22,.88); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
  button { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 7px; height: 30px; min-width: 34px;
    padding: 0 9px; font: 12px var(--mono); cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.on { border-color: var(--accent); color: var(--accent); }
  .btns { display: flex; gap: 6px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .time { font: 11px var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 95% at 50% 46%, transparent 58%, rgba(0,0,0,.42) 100%); }
  .loading { position: absolute; inset: 0; pointer-events: none; display: grid; place-items: center; color: var(--dim); font: 12px var(--mono); }
  @media (max-width: 820px) {
    body { overflow: auto; }
    .app { grid-template-columns: 1fr; grid-template-rows: 60vh auto; height: auto; padding: 16px; }
    .stage { order: -1; height: 60vh; }
    .speed { font-size: 44px; }
  }
  @media (max-width: 560px) {
    .bar { grid-template-columns: auto auto; justify-content: space-between; row-gap: 8px; bottom: 12px; padding: 8px 10px; }
    .bar > div:nth-child(2) { grid-column: 1 / -1; order: -1; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="label" id="camsLabel">Dashcam</div>
    <div class="cams" id="cams"></div>
  </aside>
  <main class="stage" id="stage">
    <div class="vignette"></div>
    <div class="loading" id="loading">loading splat…</div>
    <div class="hud">
      <div class="speed" id="speed">—</div>
      <div class="unit">MPH</div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="meta" id="meta"></div>
    <div class="bar">
      <div class="btns">
        <button id="play" title="Play / pause (space)">❚❚</button>
        <button id="rate" title="Playback speed">1×</button>
      </div>
      <div>
        <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline">
        <div class="time"><span id="tcur">0:00</span> / <span id="tdur">0:00</span></div>
      </div>
      <div class="btns">
        <button id="mChase" class="on" title="Chase camera">chase</button>
        <button id="mDriver" title="Driver view">driver</button>
        <button id="mFree" title="Free orbit">free</button>
      </div>
    </div>
  </main>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.2.0/dist/spark.module.js"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { toCreasedNormals } from "three/addons/utils/BufferGeometryUtils.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { SparkRenderer, SplatMesh, SplatEdit, SplatEditSdf, SplatEditSdfType, SplatEditRgbaBlendMode } from "@sparkjsdev/spark";

const $ = (id) => document.getElementById(id);
const [path, tel] = await Promise.all([
  fetch("path.json").then((r) => r.json()),
  fetch("telemetry.json").then((r) => r.json()).catch(() => []),
]);
const M = 1 / path.metresPerUnit;          // metres -> scene units
const UP = new THREE.Vector3(...path.up);
const frames = path.frames.map((f) => ({ t: f.t, p: new THREE.Vector3(...f.p), f: new THREE.Vector3(...f.f) }));
const DUR = path.dur;
$("meta").innerHTML = `${path.timestamp ?? path.clip}<br>${path.cams.length} cameras · gaussian splat`;
$("tdur").textContent = fmt(DUR);

// ---- side panel videos ----
const ORDER = ["front", "left_pillar", "right_pillar", "left_repeater", "right_repeater", "back"];
const videos = [];
for (const cam of ORDER.filter((c) => path.cams.includes(c))) {
  const d = document.createElement("div");
  d.className = "cam" + (cam === "front" || cam === "back" ? " wide" : "");
  const v = Object.assign(document.createElement("video"), { src: `cams/${cam}.mp4`, muted: true, playsInline: true, preload: "auto" });
  d.append(v, Object.assign(document.createElement("span"), { textContent: cam.replace("_", " ") }));
  $("cams").append(d);
  videos.push(v);
}
const lead = videos[0]; // master clock source while playing (front when present)
$("camsLabel").textContent = `Dashcam · ${videos.length} cameras`;

// ---- three / spark ----
const stage = $("stage");
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
// AgX for the car's lit materials. Spark's splat shader never includes three's tone-mapping chunk,
// so the reconstruction's colours pass through untouched (checked by pixel diff in testing).
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.05;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d10);
const camera = new THREE.PerspectiveCamera(45, 1, 0.05 * M, 2000 * M);
camera.up.copy(UP);
scene.add(new SparkRenderer({ renderer }));

const splat = new SplatMesh({
  url: "scene.ply",
  onProgress: (e) => { if (e.lengthComputable) $("loading").textContent = `loading splat… ${Math.round((100 * e.loaded) / e.total)}%`; },
});
splat.initialized.then(
  () => $("loading").remove(),
  (err) => { console.error("scene.ply failed to load", err); $("loading").textContent = "splat unavailable (scene.ply failed to load)"; },
);
scene.add(splat);

// Ego-car clean-up: splats whose centres fall inside a box around the car (floaters and smeared
// reflections of our own car) are faded out with a Spark SDF edit. The road surface splats (centres
// below ~12 cm) are kept so the contact shadow sits on real road. Box half-extents are in metres
// because the edit lives in a group scaled by M (Spark divides out the world scale).
const egoHole = new THREE.Group();
{
  const edit = new SplatEdit({ rgbaBlendMode: SplatEditRgbaBlendMode.MULTIPLY, softEdge: 0.25 });
  const box = new SplatEditSdf({ type: SplatEditSdfType.BOX, opacity: 0, radius: 0.3 });
  box.scale.set(1.25, 1.1, 2.75); // half-extents: width, height, length (m)
  box.position.set(0, 0.12 + 1.1, 0);
  edit.add(box);
  egoHole.add(edit);
  egoHole.scale.setScalar(M);
}
scene.add(egoHole);

// ---- ego car ----
// An ORIGINAL stylised white crossover with Model Y-like proportions (4.75 m long, 1.92 m wide,
// 1.62 m tall, 2.89 m wheelbase), built entirely in code: no downloaded models, no logos, no copied
// design details. Car local axes: +z forward, +y up, +x = the car's left side; units are metres.
// Construction: side-profile shapes are extruded across the width, tessellated, bent with a
// tumblehome / plan-view rounding field, then given creased normals (smooth panels, crisp edges).
// Trim pieces (glass, cladding, lamps) are "shells" extruded from the same profile a few mm proud of
// the paint, so they always follow the body surface.
const CAR = { W: 1.92, bevel: 0.06, wheelR: 0.355, wheelZ: 1.445, track: 0.82, camZ: 0.8 };
const v2 = ([x, y]) => new THREE.Vector2(x, y);
const tumble = (y) => 1 - 0.24 * Math.min(1, Math.max(0, (y - 0.95) / 0.7)) ** 1.4;
const planRound = (z) => { const e = Math.max(0, (Math.abs(z) - 1.72) / 0.7); return 1 - 0.2 * e * e; };
const skirt = (y) => (y < 0.4 ? 1 - 0.06 * (0.4 - y) / 0.16 : 1);
// body outline above the floor, front bumper -> over the roof -> down the tail (x forward, y up)
const UPPER = new THREE.SplineCurve([[2.12, 0.26], [2.31, 0.34], [2.37, 0.5], [2.34, 0.65], [2.22, 0.75], [1.65, 0.85],
  [1.08, 0.95], [0.3, 1.47], [-0.4, 1.585], [-1.2, 1.54], [-1.78, 1.31], [-2.14, 1.11], [-2.29, 1.04], [-2.36, 0.8],
  [-2.35, 0.48], [-2.25, 0.28]].map(v2)).getSpacedPoints(200);
const nearestIdx = (x, y) => UPPER.reduce((best, p, i) => (p.distanceTo(v2([x, y])) < UPPER[best].distanceTo(v2([x, y])) ? i : best), 0);
// outward offset of a run of UPPER (which runs counter-clockwise around the profile)
function offsetRun(i0, i1, d) {
  const out = [];
  for (let i = i0; i <= i1; i++) {
    const a = UPPER[Math.max(0, i - 1)], b = UPPER[Math.min(UPPER.length - 1, i + 1)];
    const dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy) || 1;
    out.push(new THREE.Vector2(UPPER[i].x + (dy / l) * d, UPPER[i].y - (dx / l) * d));
  }
  return out;
}
// Crack-free refinement: split every edge whose extent in the (y, z) profile plane exceeds maxLen at
// its midpoint. The decision depends only on the edge, so both neighbouring triangles agree and no
// T-junctions appear. Edges running across the width stay long: the bend below is linear in x.
function refine(positions, maxLen, maxX = Infinity) {
  let src = positions;
  for (let iter = 0; iter < 10; iter++) {
    const out = [];
    let split = 0;
    const long = (a, b) => Math.hypot(src[a + 1] - src[b + 1], src[a + 2] - src[b + 2]) > maxLen || Math.abs(src[a] - src[b]) > maxX;
    const mid = (a, b) => [(src[a] + src[b]) / 2, (src[a + 1] + src[b + 1]) / 2, (src[a + 2] + src[b + 2]) / 2];
    const P = (i) => [src[i], src[i + 1], src[i + 2]];
    for (let i = 0; i < src.length; i += 9) {
      let [a, b, c] = [i, i + 3, i + 6];
      let ab = long(a, b), bc = long(b, c), ca = long(c, a);
      const n = ab + bc + ca;
      if (!n) { out.push(...P(a), ...P(b), ...P(c)); continue; }
      split++;
      // rotate so the marked edges come first in a fixed pattern
      while ((n === 1 && !ab) || (n === 2 && !(ab && bc))) { [a, b, c] = [b, c, a]; [ab, bc, ca] = [bc, ca, ab]; }
      if (n === 1) { const m = mid(a, b); out.push(...P(a), ...m, ...P(c), ...m, ...P(b), ...P(c)); }
      else if (n === 2) { const m1 = mid(a, b), m2 = mid(b, c); out.push(...m1, ...P(b), ...m2, ...P(a), ...m1, ...m2, ...P(a), ...m2, ...P(c)); }
      else { const m1 = mid(a, b), m2 = mid(b, c), m3 = mid(c, a); out.push(...P(a), ...m1, ...m3, ...m1, ...P(b), ...m2, ...m3, ...m2, ...P(c), ...m1, ...m2, ...m3); }
    }
    src = out;
    if (!split) break;
  }
  return src;
}
function extrude(shape, width, { bevel = 0.012, segs = 3, tess = 0.1, keep = null } = {}) {
  let g = new THREE.ExtrudeGeometry(shape, { depth: width - 2 * bevel, bevelEnabled: bevel > 0, bevelThickness: bevel,
    bevelSize: bevel, bevelSegments: segs, curveSegments: 24, steps: 1 });
  g.translate(0, 0, -(width - 2 * bevel) / 2);
  g.rotateY(-Math.PI / 2); // profile x (length) -> +z forward, extrusion -> x (width)
  const refined = refine(Array.from(g.attributes.position.array), tess, keep ? 0.05 : Infinity);
  g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(refined, 3));
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i), z = pos.getZ(i);
    pos.setX(i, pos.getX(i) * tumble(y) * planRound(z) * skirt(y));
  }
  if (keep) { // drop triangles whose centroid fails keep(x, y, z)
    const src = pos.array, out = [];
    for (let i = 0; i < src.length; i += 9) {
      if (keep((src[i] + src[i + 3] + src[i + 6]) / 3, (src[i + 1] + src[i + 4] + src[i + 7]) / 3, (src[i + 2] + src[i + 5] + src[i + 8]) / 3))
        for (let k = 0; k < 9; k++) out.push(src[i + k]);
    }
    g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(out, 3));
  }
  g.deleteAttribute("normal");
  return toCreasedNormals(g, THREE.MathUtils.degToRad(30));
}
const mats = {
  paint: new THREE.MeshPhysicalMaterial({ color: 0xf3f4f6, roughness: 0.3, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.05 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0x07090c, roughness: 0.12, metalness: 0.25, clearcoat: 1, clearcoatRoughness: 0.12 }),
  trim: new THREE.MeshStandardMaterial({ color: 0x15171a, roughness: 0.72 }),
  well: new THREE.MeshBasicMaterial({ color: 0x050505 }),
  tyre: new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.92 }),
  rim: new THREE.MeshStandardMaterial({ color: 0x5a5f67, metalness: 0.75, roughness: 0.32 }),
  rimDark: new THREE.MeshStandardMaterial({ color: 0x1d2024, metalness: 0.5, roughness: 0.5 }),
  // lamps skip tone mapping so lit lamps stay saturated (AgX would wash bright red out to pink)
  tail: new THREE.MeshStandardMaterial({ color: 0x1c0204, emissive: 0xff0a14, emissiveIntensity: 0.5, roughness: 0.2, toneMapped: false }),
  lens: new THREE.MeshPhysicalMaterial({ color: 0x0b0d11, roughness: 0.08, metalness: 0.2, clearcoat: 1 }),
  drl: new THREE.MeshBasicMaterial({ color: 0xeef4ff, toneMapped: false }),
  amberF: new THREE.MeshStandardMaterial({ color: 0x121317, emissive: 0xff9a10, emissiveIntensity: 0, roughness: 0.2, toneMapped: false }),
  amberR: new THREE.MeshStandardMaterial({ color: 0x1c0605, emissive: 0xff9a10, emissiveIntensity: 0, roughness: 0.2, toneMapped: false }),
};
const car = new THREE.Group();
const carBody = new THREE.Group(); // pitch/roll applied here (drive mode); wheels stay on the ground
car.add(carBody);
{
  const { W, bevel, wheelR, wheelZ } = CAR;
  // painted body with real wheel-arch openings
  const R = 0.48, a = Math.asin((0.26 - wheelR) / R);
  const body = new THREE.Shape();
  body.moveTo(-2.2, 0.26);
  for (const xc of [-wheelZ, wheelZ]) { body.lineTo(xc - R * Math.cos(a), 0.26); body.absarc(xc, wheelR, R, Math.PI - a, a, true); }
  body.lineTo(2.12, 0.26);
  for (const p of UPPER.slice(1)) body.lineTo(p.x, p.y);
  carBody.add(new THREE.Mesh(extrude(body, W, { bevel, segs: 5, tess: 0.12 }), mats.paint));

  // glass canopy: windscreen, glass roof and rear glass in one piece; narrower than the roof so
  // painted roof rails and A-pillars frame it
  const g0 = nearestIdx(1.08, 0.95), g1 = nearestIdx(-2.12, 1.12);
  const canopy = new THREE.Shape([...offsetRun(g0, g1, bevel + 0.012 - 0.006), ...offsetRun(g0, g1, bevel - 0.08).reverse()]);
  carBody.add(new THREE.Mesh(extrude(canopy, W - 0.26, { bevel: 0.006, segs: 2, tess: 0.15 }), mats.glass));

  // side windows (daylight opening): a glass band slightly wider than the body at window height
  const dlo = new THREE.SplineCurve([[0.92, 1.0], [0.55, 1.22], [0.22, 1.42], [-0.4, 1.5], [-1.15, 1.46], [-1.55, 1.3],
    [-1.72, 1.12], [-1.7, 1.05], [-1.2, 1.03], [0.2, 1.01], [0.92, 1.0]].map(v2)).getSpacedPoints(80);
  carBody.add(new THREE.Mesh(extrude(new THREE.Shape(dlo), W + 0.03, { bevel: 0.008, segs: 2, tess: 0.15 }), mats.glass));

  // black lower cladding all round + flared wheel-arch trims, as one shell
  const Ri = 0.435, Ro = 0.54, a1 = Math.asin((0.2 - wheelR) / Ri), a2 = Math.asin((0.42 - wheelR) / Ro);
  const front = UPPER.findIndex((p) => p.y > 0.42), rear = UPPER.findLastIndex((p) => p.y > 0.42);
  const clad = new THREE.Shape();
  clad.moveTo(-2.18, 0.2);
  for (const xc of [-wheelZ, wheelZ]) { clad.lineTo(xc - Ri * Math.cos(a1), 0.2); clad.absarc(xc, wheelR, Ri, Math.PI - a1, a1, true); }
  clad.lineTo(2.12, 0.2);
  for (const p of offsetRun(0, front, bevel + 0.01 - 0.012)) clad.lineTo(p.x, p.y);
  for (const xc of [wheelZ, -wheelZ]) { clad.lineTo(xc + Ro * Math.cos(a2), 0.42); clad.absarc(xc, wheelR, Ro, a2, Math.PI - a2, false); }
  for (const p of offsetRun(rear, UPPER.length - 1, bevel + 0.01 - 0.012)) clad.lineTo(p.x, p.y);
  carBody.add(new THREE.Mesh(extrude(clad, W + 0.02, { bevel: 0.012, segs: 3, tess: 0.1 }), mats.trim));
  for (const z of [wheelZ, -wheelZ]) { // dark wheel wells so the arches don't show the sky through the car
    const well = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 0.98), mats.well);
    well.position.set(0, 0.56, z);
    carBody.add(well);
  }

  // tail lamps wrap the rear corners (within the body width); amber signal segment below them
  const tailI0 = nearestIdx(-2.33, 1.06), tailI1 = nearestIdx(-2.36, 0.95);
  const tailRun = offsetRun(tailI0, tailI1, bevel + 0.004 - 0.004);
  const tailShape = new THREE.Shape([...tailRun, v2([-1.98, tailRun.at(-1).y]), v2([-2.04, tailRun[0].y])]);
  carBody.add(new THREE.Mesh(extrude(tailShape, W + 0.008, { bevel: 0.004, segs: 1, tess: 0.05, keep: (x) => Math.abs(x) > 0.36 }), mats.tail));
  const ambI0 = nearestIdx(-2.36, 0.935), ambI1 = nearestIdx(-2.36, 0.89);
  const ambRun = offsetRun(ambI0, ambI1, bevel + 0.004 - 0.004);
  const ambShape = new THREE.Shape([...ambRun, v2([-2.1, ambRun.at(-1).y]), v2([-2.1, ambRun[0].y])]);
  const ambR = extrude(ambShape, W + 0.008, { bevel: 0.004, segs: 1, tess: 0.05, keep: (x) => Math.abs(x) > 0.5 });
  // head lamps: slim, swept back along the bumper/hood shoulder; amber segment on the outer corner
  const hI0 = nearestIdx(2.33, 0.645), hI1 = nearestIdx(2.27, 0.715);
  const hRun = offsetRun(hI0, hI1, bevel + 0.004 - 0.004);
  const hShape = new THREE.Shape([...hRun, v2([1.92, hRun.at(-1).y - 0.01]), v2([1.98, hRun[0].y - 0.03])]);
  carBody.add(new THREE.Mesh(extrude(hShape, W + 0.008, { bevel: 0.004, segs: 1, tess: 0.05, keep: (x) => Math.abs(x) > 0.34 && Math.abs(x) < 0.84 }), mats.lens));
  // daytime running light: a thin bright line along the top of each lamp
  const dI0 = nearestIdx(2.3, 0.69), dI1 = nearestIdx(2.28, 0.705);
  const dRun = offsetRun(dI0, dI1, bevel + 0.008 - 0.003);
  const dShape = new THREE.Shape([...dRun, v2([1.95, dRun.at(-1).y - 0.012]), v2([1.96, dRun[0].y - 0.016])]);
  carBody.add(new THREE.Mesh(extrude(dShape, W + 0.016, { bevel: 0.003, segs: 1, tess: 0.05, keep: (x) => Math.abs(x) > 0.36 && Math.abs(x) < 0.82 }), mats.drl));
  const ambF = extrude(hShape, W + 0.01, { bevel: 0.004, segs: 1, tess: 0.05, keep: (x) => Math.abs(x) >= 0.84 });
  // split the amber shells into left (+x) / right (-x) meshes so each blinker flashes on its own
  const halves = (geo, keepLeft) => {

  return acc < -1e-3 ? -1 : 1;
})();
function fmt(s) { return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`; }
function hud(t) {
  const s = telAt(t);
  $("speed").textContent = s ? Math.round(s.mph) : "—";
  const chips = [];
  if (s) {
    chips.push(`<span class="chip">${s.gear ?? "?"}</span>`);
    if (s.autopilot && s.autopilot !== "NONE") chips.push(`<span class="chip on">${s.autopilot.replace("_", " ").toLowerCase()}</span>`);
    if (s.brake) chips.push(`<span class="chip warn">brake</span>`);
    if (s.blinkL) chips.push(`<span class="chip on">◀ signal</span>`);
    if (s.blinkR) chips.push(`<span class="chip on">signal ▶</span>`);
    if (s.steer != null) chips.push(`<span class="chip">steer ${Math.round(s.steer)}°</span>`);
  } else chips.push(`<span class="chip">no telemetry in clip</span>`);
  $("chips").innerHTML = chips.join("");
  $("tcur").textContent = fmt(t);
  $("scrub").value = String(Math.round((t / DUR) * 1000));
}

function resize() {
  const { clientWidth: w, clientHeight: h } = stage;
  renderer.setSize(w, h, false);
  camera.aspect = orbitCam.aspect = w / h;
  camera.updateProjectionMatrix(); orbitCam.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

// place car + clean-up box at a pose and apply telemetry-driven lamps / steering
function placeCar(ps, t) {
  car.quaternion.copy(ps.q);
  car.position.copy(ps.carPos);
  egoHole.position.copy(car.position); egoHole.quaternion.copy(car.quaternion);
  const s = telAt(t);
  setCarSignals({ brake: !!s?.brake, blinkL: !!s?.blinkL, blinkR: !!s?.blinkR, steer: s?.steer != null ? THREE.MathUtils.degToRad(s.steer * steerSign) / 15 : 0, t });
}
// hide the car while the camera is inside it (driver view, start of the intro, blends)
function carVisibleFrom(cam) {
  car.updateMatrixWorld();
  const l = car.worldToLocal(_v.copy(cam.position));
  return !(Math.abs(l.x) < 1.15 && l.y < 1.9 && Math.abs(l.z) < 2.6);
}
function updateKeyLight() {
  camera.updateMatrixWorld();
  key.position.copy(camera.position).addScaledVector(UP, 4 * M).addScaledVector(camera.getWorldDirection(_v), -3 * M);
  key.target.position.copy(car.position);
}

window.__otrv = { THREE, scene, camera, car, controls, orbitCam, egoHole, splat, M, UP, view, poseAt, setMode, seek }; // debug handle (tests)
renderer.setAnimationLoop((now) => {
  const rdt = Math.max(0, Math.min(0.5, (now - last) / 1000)), dt = Math.min(0.1, rdt);
  last = now;
  if (playing) {
    // follow the lead video when it is actually playing, so slow frames don't drag the clock behind the footage
    if (lead && !lead.paused && !lead.seeking && lead.readyState >= 3 && Math.abs(lead.currentTime - clock) < 1) clock = lead.currentTime;
    else clock += dt * rate;
    if (clock >= DUR || lead?.ended) seek(0);
  }
  // keep side videos on the master clock: nudge playbackRate for small drift, hard-seek only on large drift
  for (const v of videos) {
    if ((playing && v === lead && Math.abs(clock - v.currentTime) < 1) || v.readyState < 2 || v.seeking || clock >= v.duration) continue;
    const d = clock - v.currentTime;
    if (!playing || Math.abs(d) > 1) { if (Math.abs(d) > 0.15) v.currentTime = clock; v.playbackRate = rate; }
    else v.playbackRate = rate * (1 + Math.max(-0.25, Math.min(0.25, d)));
  }

  const ps = poseAt(clock);
  placeCar(ps, clock);
  updateRibbon(clock);
  updateCamera(ps, dt, rdt);
  car.visible = carVisibleFrom(camera);
  updateKeyLight();
  hud(clock);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
