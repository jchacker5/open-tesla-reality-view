name: Bug report
description: Something in ingest / prep / recon / the viewer doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Don't attach real dashcam footage, frames or telemetry.** They contain GPS traces, plates and faces.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact `otrv` command and the error output (redact paths or locations if needed). Add `--debug` for a traceback.
      render: shell
    validations:
      required: true
  - type: input
    id: car
    attributes:
      label: Car, hardware and firmware
      placeholder: Model Y 2024, HW4, firmware 2025.44.25, 6 cameras
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: The output of `uv run otrv doctor` (OS, chip, ffmpeg, COLMAP, Brush, disk, RAM), plus your Python version.
      render: text
    validations:
      required: true
